<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>카카오톡 공유 테스트</title>

    <!-- Kakao JavaScript SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"></script>
    <script src="config.js"></script>

    <style>
        body {
            margin: 0;
            padding: 50px 20px;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #FEE500;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #log {
            margin: 30px auto 0;
            padding: 20px;
            max-width: 700px;
            background: #fff;
            border-radius: 10px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>카카오톡 공유 테스트</h1>

    <button onclick="shareKakao()">
        카카오톡으로 공유하기
    </button>

    <div id="log">① 페이지 실행</div>


    <script>

        // ==================================================
        // 1. 카카오 JavaScript 키
        // ==================================================

        // ==================================================
        // 2. 로그 표시
        // ==================================================

        const log = document.getElementById("log");

        function addLog(message) {

            log.innerText += "\n" + message;

            console.log(message);
        }


        // ==================================================
        // 3. Kakao SDK 확인
        // ==================================================

        if (typeof Kakao === "undefined") {

            addLog("❌ Kakao SDK를 불러오지 못했습니다.");

        } else {

            addLog("② Kakao 객체 확인: " + typeof Kakao);


            // ==================================================
            // 4. Kakao 초기화
            // ==================================================

            try {

                Kakao.init(KAKAO_JS_KEY);

                addLog("③ Kakao.init 실행");

                addLog(
                    "④ Kakao 초기화 상태: " +
                    Kakao.isInitialized()
                );

            } catch (error) {

                addLog(
                    "❌ Kakao 초기화 오류\n" +
                    formatError(error)
                );
            }
        }


        // ==================================================
        // 5. 오류 내용을 최대한 자세하게 표시
        // ==================================================

        function formatError(error) {

            try {

                if (error === null || error === undefined) {
                    return String(error);
                }

                if (typeof error === "object") {

                    return JSON.stringify(
                        error,
                        function(key, value) {

                            if (typeof value === "function") {
                                return "[Function]";
                            }

                            return value;
                        },
                        2
                    );
                }

                return String(error);

            } catch (e) {

                return String(error);
            }
        }


        // ==================================================
        // 6. 카카오톡 공유
        // ==================================================

        function shareKakao() {

            addLog("⑤ 공유 버튼 클릭");


            // --------------------------------------------------
            // Kakao 초기화 확인
            // --------------------------------------------------

            if (
                typeof Kakao === "undefined" ||
                !Kakao.isInitialized()
            ) {

                addLog(
                    "❌ Kakao가 초기화되지 않았습니다."
                );

                return;
            }


            addLog("⑥ sendCustom 호출 시작");


            // --------------------------------------------------
            // Custom Template 공유
            // --------------------------------------------------

            try {

                const result = Kakao.Share.sendCustom({

                    // 현재 사용 중인 템플릿 ID
                    templateId: KAKAO_TEMPLATE_ID

                });


                addLog(
                    "⑦ sendCustom 호출 완료"
                );


                // --------------------------------------------------
                // Promise 결과 확인
                // --------------------------------------------------

                if (
                    result &&
                    typeof result.then === "function"
                ) {

                    result

                    .then(function(response) {

                        addLog(
                            "⑧ ✅ 공유 성공\n" +
                            formatError(response)
                        );

                    })

                    .catch(function(error) {

                        addLog(
                            "⑧ ❌ 공유 실패\n" +
                            formatError(error)
                        );

                    });

                } else {

                    addLog(
                        "⑧ sendCustom이 Promise를 반환하지 않았습니다."
                    );
                }


            } catch (error) {

                addLog(
                    "❌ sendCustom 실행 중 예외 발생\n" +
                    formatError(error)
                );
            }
        }

    </script>

</body>
</html>
