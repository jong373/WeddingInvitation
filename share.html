```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>카카오톡 공유 테스트</title>

    <script
        src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"
        crossorigin="anonymous">
    </script>
</head>

<body>

<h2>카카오톡 공유 테스트</h2>

<button id="shareButton">카카오톡 공유 테스트</button>

<pre id="log"></pre>

<script>

const KAKAO_JS_KEY = "c53d59796a73319efdfbb92a38d5f08f";

function log(message) {
    console.log(message);

    document.getElementById("log").textContent +=
        message + "\n";
}

log("① 페이지 실행");

try {

    log("② Kakao 객체 확인: " + typeof Kakao);

    Kakao.init(KAKAO_JS_KEY);

    log("③ Kakao.init 실행");

    log("④ Kakao 초기화 상태: " + Kakao.isInitialized());

} catch (error) {

    log("❌ 초기화 오류");
    log(JSON.stringify(error, null, 2));

}


document.getElementById("shareButton").addEventListener("click", function () {

    log("⑤ 공유 버튼 클릭");

    try {

        Kakao.Share.sendCustom({
            templateId: 1570543
        })
        .then(function(result) {

            log("⑥ 공유 성공");
            log(JSON.stringify(result, null, 2));

        })
        .catch(function(error) {

            log("❌ 카카오 공유 오류");
            log(JSON.stringify(error, null, 2));

        });

    } catch (error) {

        log("❌ 실행 오류");
        log(JSON.stringify(error, null, 2));

    }

});

</script>

</body>
</html>
