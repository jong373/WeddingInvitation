<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>청첩장 공유 테스트</title>

    <script
        src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"
        crossorigin="anonymous">
    </script>
</head>

<body>

<h2>카카오톡 공유 테스트</h2>

<button id="shareButton">카카오톡으로 공유하기</button>

<pre id="log"></pre>

<script>

const KAKAO_JS_KEY = "c53d59796a73319efdfbb92a38d5f08f";

function log(message) {
    console.log(message);

    document.getElementById("log").textContent +=
        message + "\n";
}


/* ① 카카오 SDK 확인 */
log("① 페이지 실행");

log("② Kakao 객체 확인: " + typeof Kakao);


/* ② 카카오 초기화 */
try {

    Kakao.init(KAKAO_JS_KEY);

    log("③ Kakao.init 실행");
    log("④ Kakao 초기화 상태: " + Kakao.isInitialized());

} catch (error) {

    log("❌ Kakao 초기화 오류");
    console.error(error);

}


/* ③ 버튼 클릭 시 카카오 공유 */
document.getElementById("shareButton").addEventListener("click", function () {

    log("⑤ 공유 버튼 클릭");

    try {

        Kakao.Share.sendCustom({
            templateId: 1570543
        });

        log("⑥ sendCustom 호출 완료");

    } catch (error) {

        log("❌ sendCustom 실행 오류");

        console.error(error);

        log(
            error && error.message
                ? error.message
                : String(error)
        );

    }

});

</script>

</body>
</html>
